name: Keep Render Alive

on:
  schedule:
    # Runs every 14 minutes (prevents the 15-min sleep)
    - cron: '*/10 * * * *'
  # Allows you to run it manually from the Actions tab
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: curl -s https://ai-website-builder-cr3b.onrender.com/   
